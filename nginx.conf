server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Giu dong bo voi vercel.json — hai duong trien khai phai co cung chinh sach.
    # img-src de rong (https:) vi anh sach do admin nhap URL tu do (Cloudinary, CDN nha sach...);
    # khoa cung danh sach host se lam vo anh ngay khi them nguon moi. Anh khong phai vector
    # thuc thi script nen danh doi nay chap nhan duoc; script-src van khoa chat.
    set $csp "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:8080 https://book-be-jakn.onrender.com; frame-ancestors 'none'; form-action 'self'; base-uri 'self'; object-src 'none'";

    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Proxy API calls tới backend
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Build assets carry a content hash in their filename, so a given URL
    # never changes content and can be cached indefinitely.
    #
    # add_header trong block con ghi de TOAN BO add_header cua block cha, nen moi block
    # dat them header rieng phai lap lai cac security header.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # index.html names the hashed bundles, so a stale copy pins the app to an
    # old build. It must be revalidated on every load.
    location = /index.html {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    location = /asset-manifest.json {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Content-Security-Policy $csp always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    }

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }
}
